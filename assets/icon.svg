<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Featherbar app icon: a laptop with a single orange wing.
       Source for assets/AppIcon.icns (see scripts/make_icon.sh). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3ECF9"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A7FE6"/>
      <stop offset="1" stop-color="#2563CC"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D4C9E"/>
      <stop offset="1" stop-color="#143A7E"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- macOS squircle tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- artwork, scaled and centered inside the tile -->
  <g transform="translate(512 528) scale(0.88) translate(-476 -460)">
  <!-- shadow under the laptop -->
  <ellipse cx="400" cy="752" rx="280" ry="24" fill="#1E3A6B" opacity="0.22" filter="url(#soft)"/>

  <!-- wing: feathers rooted behind the lid's right edge, swept up and back,
       drawn bottom-up so each longer feather overlaps the one below -->
  <g stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">
    <path d="M 554.9,603.4 C 677.4,577.2 768.3,577.1 807.6,605.2 C 771.3,634.2 688.9,659.2 565.1,676.6 Z" fill="#FF7400"/>
    <path d="M 548.6,547.7 C 689.3,494.9 796.5,476.0 846.9,497.3 C 808.3,535.2 714.8,578.4 571.4,622.3 Z" fill="#FF8410"/>
    <path d="M 542.0,493.1 C 690.5,409.8 806.6,368.7 865.6,381.0 C 828.2,428.4 730.8,492.3 578.0,566.9 Z" fill="#FF9322"/>
    <path d="M 535.3,439.8 C 678.9,326.6 794.9,263.3 859.0,265.6 C 826.9,321.7 734.2,405.5 584.7,510.2 Z" fill="#FFA235"/>
    <path d="M 528.7,392.6 C 654.3,256.3 760.8,174.8 826.2,168.0 C 803.6,229.8 724.3,328.9 591.3,457.4 Z" fill="#FFB24A"/>
  </g>

  <!-- laptop lid (covers the feather roots) -->
  <rect x="150" y="400" width="440" height="296" rx="30" fill="url(#lid)"/>
  <rect x="178" y="428" width="384" height="240" rx="12" fill="url(#screen)"/>
  <!-- subtle screen sheen -->
  <path d="M178,440 Q178,428 190,428 L400,428 L272,668 L190,668 Q178,668 178,656 Z" fill="#FFFFFF" opacity="0.06"/>

  <!-- laptop base -->
  <path d="M102,702 L638,702 Q654,702 650,718 Q646,738 622,738 L118,738 Q94,738 90,718 Q86,702 102,702 Z" fill="#2563CC"/>
  <rect x="328" y="702" width="84" height="12" rx="6" fill="#1A4FA8"/>
  </g>
</svg>
